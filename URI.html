<html><head><style>*{box-sizing:border-box}html{--s:123px;--c1:%231d1d1d;--c2:%234e4f51;--c3:%233c3c3c;background:repeating-conic-gradient(from 30deg,%230000 0 120deg,var(--c3) 0 50%) calc(var(--s)/2) calc(var(--s)*tan(30deg)/2),repeating-conic-gradient(from 30deg,var(--c1) 0 60deg,var(--c2) 0 120deg,var(--c3) 0 50%);background-size:var(--s) calc(var(--s)*tan(30deg))}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;color:%23fff}.game{background:%23333;width:460px;padding:30px;text-align:center;border-radius:30px;display:flex;flex-direction:column;align-items:center}h1{font-size:3rem}button{width:280px;height:280px;margin:10px;font-size:1.2rem;font-weight:700;border:0;border-radius:140px;display:flex;align-items:center;justify-content:center;background:%23aaa;cursor:pointer;transition:.1s}button:hover{transform:scale(1.05)}button:active{transform:scale(.95)}.score{padding-top:20px;font-size:1.2rem}.round{padding-top:5px;font-size:1rem}</style></head><body><div class=game><h1>The Button Game</h1><button id=Click>click</button><div class=score id=score></div><div class=round id=round></div></div><script>let s=0,r=1,c=0,t,g=0,d=0,b=document.getElementById("Click"),rt=document.getElementById("round"),st=document.getElementById("score"),p,cmd=["CLICK","DON'T CLICK","CLICK TWICE","CLICK 3 TIMES","WAIT","CLICK WHEN GREEN","DON'T CLICK WHEN GREEN","CLICK WHEN RED","DON'T CLICK WHEN RED","CLICK TWICE WHEN GREEN","CLICK ONCE WHEN RED","WAIT 2 SECONDS","CLICK AFTER 2 SECONDS","DON'T CLICK FOR 3 SECONDS"];rt.innerHTML="Round: "+r;st.innerHTML="Score: "+s;function pick(){let n=Math.floor(Math.random()*r+Math.floor(Math.random()*2));p=cmd[Math.min(n,cmd.length-1)];g=d=0;b.style.backgroundColor="";let x=Math.floor(Math.random()*5+1)*1e3;if(p==cmd[1])t=setTimeout(()=>check(1),2e3);else if(p==cmd[4])t=setTimeout(()=>check(1),Math.random()*1e4);else if([5,6,9].includes(cmd.indexOf(p)))t=setTimeout(()=>change(1),x);else if([7,8,10].includes(cmd.indexOf(p)))t=setTimeout(()=>change(2),x);else if(p==cmd[11])t=setTimeout(()=>check(1),2e3);else if(p==cmd[12])t=setTimeout(()=>check(2),2e3);else if(p==cmd[13])t=setTimeout(()=>check(1),3e3);return p}function change(x){g=x==1;d=x==2;b.style.backgroundColor=x==1?"green":"red"}function next(){r++;rt.innerHTML="Round: "+r;c=0;b.innerHTML=pick()}b.onclick=()=>{c++;check(0)};function check(x){let i=cmd.indexOf(p),ok=0;if(i==0)ok=x==0;if(i==1)ok=x==1;if(i==2)ok=x==0&&c==2;if(i==3)ok=x==0&&c==3;if(i==4)ok=x==1;if(i==5)ok=x==0&&g;if(i==6)ok=x==0&&!g;if(i==7)ok=x==0&&d;if(i==8)ok=x==0&&!d;if(i==9)ok=x==0&&g&&c==2;if(i==10)ok=x==0&&d&&c==1;if(i==11)ok=x==1;if(i==12)ok=x==2;if(i==13)ok=x==1;if(i==1||i==4||i>=11)if(x==0)ok=0;if(i==2&&x==0&&c<2)return;if(i==3&&x==0&&c<3)return;if(ok){s++;st.innerHTML="Score: "+s;clearTimeout(t);next()}else if(x==0){s=0;st.innerHTML="Score: 0";c=0;clearTimeout(t)}}b.innerHTML=pick();</script></body></html>
